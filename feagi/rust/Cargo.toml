[package]
name = "feagi-rust"
version = "0.1.0"
edition = "2021"
authors = ["FEAGI Team"]
description = "SIMD and WebGPU optimized data structures for FEAGI"

[lib]
name = "feagi_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
# SIMD and data structure optimization
roaring = "0.10.1"  # Roaring bitmap for FCL
bytemuck = { version = "1.13.1", features = ["derive"] }  # For byte casting

# WebGPU - Made optional
wgpu = { version = "0.17.0", optional = true }
futures = { version = "0.3.28", optional = true }

# Python bindings
pyo3 = { version = "0.20.3", features = ["extension-module"] }

[features]
default = []
webgpu = ["wgpu", "futures"]
simd-avx2 = []
simd-neon = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort" 