<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" type="text/css" href="/static/css/swagger-dark.css" media="(prefers-color-scheme: dark)" id="theme-dark"/>
  <link rel="stylesheet" type="text/css" href="/static/css/swagger-light.css" media="(prefers-color-scheme: light)" id="theme-light"/>
  <link rel="icon" type="image/png" href="/static/favicon.ico"/>

  <style>

      height: 50px;
      width: auto;
      margin-right: 10px;
    }

    .custom-header {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      border-bottom: 1px solid #ccc;
      background: var(--header-bg, #f9f9f9);
    }

    .custom-header h1 {
      font-size: 1.5em;
      margin: 0;
      flex: 1 1 auto;
      color: var(--header-text, #000);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    .header-button {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      background-color: #007acc;
      color: white;
      cursor: pointer;
      font-size: 0.9em;
      transition: background-color 0.2s;
    }

    .header-button:hover {
      background-color: #005fa3;
    }

    .theme-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-selector-label {
      font-weight: 600;
      font-size: 0.9em;
    }

    .theme-selector select {
      padding: 6px 28px 6px 10px;
      border-radius: 4px;
      font-size: 0.9em;
      border: 1px solid #ccc;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='currentColor' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 14px;
      min-width: 140px;
    }
    
    /* Custom filter container */
    .custom-filter-container {
      width: 100%;
      padding: 10px 20px;
      background: var(--filter-bg, #f0f0f0); 
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
    }
    
    /* Filter input styling */
    .custom-filter-input {
      width: 300px;
      padding: 8px 12px;
      border-radius: 4px;
      border: 2px solid #007acc;
      font-size: 14px;
      background-color: white;
      color: #333;
      transition: all 0.2s ease;
    }
    
    .custom-filter-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.3);
    }
    
    .custom-filter-label {
      font-weight: 600;
      margin-right: 10px;
      color: var(--filter-text, #333);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --header-bg: #222;
        --header-text: #fff;
        --filter-bg: #333;
        --filter-text: #fff;
      }
      
      /* Dark mode filter input */
      .custom-filter-input {
        background-color: #444;
        color: #fff;
        border-color: #007acc;
      }
      
      .custom-filter-input::placeholder {
        color: #aaa;
      }
    }
  </style>
</head>
<body>

  <div class="custom-header">
    <h1>FEAGI API Documentation</h1>
    <div class="header-actions">
      <button class="header-button" id="expand-all">Expand All</button>
      <button class="header-button" id="collapse-all">Collapse All</button>
      <div class="theme-selector">
        <span class="theme-selector-label">Theme:</span>
        <select id="theme-select">
          <option value="system">System</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
    </div>
  </div>
  
  <!-- Custom filter section -->
  <div class="custom-filter-container" id="custom-filter-container">
    <span class="custom-filter-label">Filter:</span>
    <input type="text" class="custom-filter-input" id="custom-filter-input" placeholder="Filter by tag, operation, or path...">
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
  <script>
    function getSystemTheme() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function setTheme(theme) {
      const darkThemeLink = document.getElementById('theme-dark');
      const lightThemeLink = document.getElementById('theme-light');
      const themeSelect = document.getElementById('theme-select');
      themeSelect.value = theme;

      if (theme === 'system') {
        darkThemeLink.media = '(prefers-color-scheme: dark)';
        lightThemeLink.media = '(prefers-color-scheme: light)';
        localStorage.removeItem('feagi-theme');
      } else if (theme === 'dark') {
        darkThemeLink.media = 'all';
        lightThemeLink.media = 'not all';
        localStorage.setItem('feagi-theme', 'dark');
      } else {
        darkThemeLink.media = 'not all';
        lightThemeLink.media = 'all';
        localStorage.setItem('feagi-theme', 'light');
      }

      // Apply theme colors dynamically
      document.documentElement.style.setProperty('--header-bg', theme === 'dark' ? '#222' : '#f9f9f9');
      document.documentElement.style.setProperty('--header-text', theme === 'dark' ? '#fff' : '#000');
      document.documentElement.style.setProperty('--filter-bg', theme === 'dark' ? '#333' : '#f0f0f0');
      document.documentElement.style.setProperty('--filter-text', theme === 'dark' ? '#fff' : '#333');
    }

    document.getElementById('theme-select').addEventListener('change', (e) => {
      setTheme(e.target.value);
    });

    window.onload = function () {
      const savedTheme = localStorage.getItem('feagi-theme') || 'system';
      setTheme(savedTheme);

      // Create Swagger UI instance
      const ui = SwaggerUIBundle({
        url: "{{ openapi_url }}",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        docExpansion: "none",
        filter: false, // Disable built-in filter since we're using our own
        persistAuthorization: true,
        tryItOutEnabled: true
      });

      window.ui = ui;

      // Expand/collapse functionality
      document.getElementById('expand-all').addEventListener('click', () => {
        document.querySelectorAll('.opblock-tag-section').forEach(tag => {
          if (!tag.classList.contains('is-open')) {
            tag.querySelector('.opblock-tag').click();
          }
        });
      });

      document.getElementById('collapse-all').addEventListener('click', () => {
        document.querySelectorAll('.opblock-tag-section.is-open').forEach(tag => {
          tag.querySelector('.opblock-tag').click();
        });
      });
      
      // Setup custom filter functionality
      const filterInput = document.getElementById('custom-filter-input');
      
      // Add event listener for filter input
      filterInput.addEventListener('input', function(e) {
        const searchTerm = e.target.value.trim().toLowerCase();
        
        // Get the data for the operations once we have SwaggerUI loaded
        const spec = ui.getSystem().specSelectors.specJson().toJS();
        
        // If search term is empty, show everything
        if (!searchTerm) {
          document.querySelectorAll('.opblock-tag-section').forEach(tag => {
            tag.style.display = '';
          });
          document.querySelectorAll('.opblock').forEach(op => {
            op.style.display = '';
          });
          return;
        }
        
        // Create a mapping of paths and methods
        const pathMap = {};
        
        // Process the spec to build path information
        if (spec && spec.paths) {
          Object.entries(spec.paths).forEach(([path, methods]) => {
            Object.entries(methods).forEach(([method, operation]) => {
              if (typeof operation === 'object' && operation.operationId) {
                pathMap[operation.operationId] = {
                  path: path,
                  method: method.toUpperCase(),
                  summary: operation.summary || '',
                  description: operation.description || '',
                  tags: operation.tags || []
                };
              }
            });
          });
        }
        
        // Track which tags have visible operations
        const visibleTags = new Set();
        
        // Process all operations using the path map
        document.querySelectorAll('.opblock').forEach(opblock => {
          let isVisible = false;
          let operationId = '';
          
          // Extract the operation ID from the DOM
          const opIdElement = opblock.querySelector('.opblock-summary-operation-id');
          if (opIdElement) {
            operationId = opIdElement.textContent.trim();
          } else {
            // Try to find it in class names
            Array.from(opblock.classList).forEach(className => {
              if (className.startsWith('operation-')) {
                operationId = className.replace('operation-', '');
              }
            });
          }
          
          // Get path data from our map
          const opData = pathMap[operationId];
          
          if (opData) {
            // Check if any data matches the search term
            const pathMatch = opData.path.toLowerCase().includes(searchTerm);
            const methodMatch = opData.method.toLowerCase().includes(searchTerm);
            const summaryMatch = opData.summary.toLowerCase().includes(searchTerm);
            const descMatch = opData.description.toLowerCase().includes(searchTerm);
            
            // Also check the visible text in the DOM
            const opSummary = opblock.querySelector('.opblock-summary-description');
            const summaryText = opSummary ? opSummary.textContent.trim().toLowerCase() : '';
            const domTextMatch = summaryText.includes(searchTerm);
            
            isVisible = pathMatch || methodMatch || summaryMatch || descMatch || domTextMatch;
            
            // If this operation is visible, track its tag
            if (isVisible && opData.tags) {
              opData.tags.forEach(tag => visibleTags.add(tag));
            }
          }
          
          // Show/hide based on match
          opblock.style.display = isVisible ? '' : 'none';
        });
        
        // Process tag sections - show if the tag matches or any operation within it is visible
        document.querySelectorAll('.opblock-tag-section').forEach(section => {
          const tagElement = section.querySelector('.opblock-tag');
          if (!tagElement) return;
          
          const tagText = tagElement.textContent.trim().toLowerCase();
          const tagName = section.getAttribute('data-tag');
          
          // Show if tag matches search term or contains visible operations
          const showTag = tagText.includes(searchTerm) || visibleTags.has(tagName);
          section.style.display = showTag ? '' : 'none';
          
          // If the tag itself matches, show all its operations
          if (tagText.includes(searchTerm)) {
            section.querySelectorAll('.opblock').forEach(op => {
              op.style.display = '';
            });
          }
        });
      });
    };
  </script>
</body>
</html>
