    .custom-header {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      border-bottom: 1px solid #ccc;
      background: var(--header-bg, #f9f9f9);
    }

    .custom-header h1 {
      font-size: 1.5em;
      margin: 0;
      flex: 1 1 auto;
      color: var(--header-text, #000);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    .header-button {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      background-color: #007acc;
      color: white;
      cursor: pointer;
      font-size: 0.9em;
      transition: background-color 0.2s;
    }

    .header-button:hover {
      background-color: #005fa3;
    }

    .theme-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-selector-label {
      font-weight: 600;
      font-size: 0.9em;
    }

    .theme-selector select {
      padding: 6px 28px 6px 10px;
      border-radius: 4px;
      font-size: 0.9em;
      border: 1px solid #ccc;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='currentColor' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 14px;
      min-width: 140px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --header-bg: #222;
        --header-text: #fff;
      }
    }
  </style>
</head>
<body>

  <div class="custom-header">
    <h1>FEAGI API Documentation</h1>
    <div class="header-actions">
      <button class="header-button" id="expand-all">Expand All</button>
      <button class="header-button" id="collapse-all">Collapse All</button>
      <div class="theme-selector">
        <span class="theme-selector-label">Theme:</span>
        <select id="theme-select">
          <option value="system">System</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
  <script>
    function getSystemTheme() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function setTheme(theme) {
      const darkThemeLink = document.getElementById('theme-dark');
      const lightThemeLink = document.getElementById('theme-light');
      const themeSelect = document.getElementById('theme-select');
      themeSelect.value = theme;

      if (theme === 'system') {
        darkThemeLink.media = '(prefers-color-scheme: dark)';
        lightThemeLink.media = '(prefers-color-scheme: light)';
        localStorage.removeItem('feagi-theme');
      } else if (theme === 'dark') {
        darkThemeLink.media = 'all';
        lightThemeLink.media = 'not all';
        localStorage.setItem('feagi-theme', 'dark');
      } else {
        darkThemeLink.media = 'not all';
        lightThemeLink.media = 'all';
        localStorage.setItem('feagi-theme', 'light');
      }

      // Apply header colors dynamically
      document.documentElement.style.setProperty('--header-bg', theme === 'dark' ? '#222' : '#f9f9f9');
      document.documentElement.style.setProperty('--header-text', theme === 'dark' ? '#fff' : '#000');
    }

    document.getElementById('theme-select').addEventListener('change', (e) => {
      setTheme(e.target.value);
    });

    window.onload = function () {
      const savedTheme = localStorage.getItem('feagi-theme') || 'system';
      setTheme(savedTheme);

      const ui = SwaggerUIBundle({
        url: "{{ openapi_url }}",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        docExpansion: "none",
        filter: true,
        persistAuthorization: true,
        tryItOutEnabled: true
      });

      window.ui = ui;

      document.getElementById('expand-all').addEventListener('click', () => {
        document.querySelectorAll('.opblock-tag-section').forEach(tag => {
          if (!tag.classList.contains('is-open')) {
            tag.querySelector('.opblock-tag').click();
          }
        });
      });

      document.getElementById('collapse-all').addEventListener('click', () => {
        document.querySelectorAll('.opblock-tag-section.is-open').forEach(tag => {
          tag.querySelector('.opblock-tag').click();
        });
      });
    };
  </script>
</body>
</html>
