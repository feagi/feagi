[pytest]
# Registered markers
markers =
    unit: mark a test as a unit test
    integration: mark a test as an integration test
    performance: mark a test as a performance test
    slow: mark a test as slow (taking more than 1 second)
    api: mark a test as an API test
    backend: mark a test as requiring a specific backend
    cuda: mark a test as requiring CUDA
    wgpu: mark a test as requiring WebGPU
    rust: mark a test as testing Rust implementation
    binding: mark a test as testing Python-Rust bindings
    e2e: mark a test as an end-to-end test
    architecture: mark a test as testing architecture compliance
    compliance: mark a test as testing compliance requirements

# Test discovery settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display settings
console_output_style = progress
log_cli = false
log_cli_level = WARNING

# Logging configuration for tests
log_auto_indent = true
log_capture = true
log_level = WARNING

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning 