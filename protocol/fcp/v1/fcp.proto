syntax = "proto3";

package feagi.protocol.fcp.v1;

import "protocol/common/constants.proto";

// FCP (FEAGI Control Protocol) message types
enum MessageType {
  UNKNOWN = 0;
  
  // Registration confirmation (after handshake)
  REGISTER_CONFIRM = 1;
  
  // Deregistration
  DEREGISTER = 2;
  DEREGISTER_RESPONSE = 3;
  
  // Status
  STATUS_REQUEST = 4;
  STATUS_RESPONSE = 5;
  
  // Configuration
  CONFIGURE = 6;
  CONFIGURE_RESPONSE = 7;
  
  // Heartbeat
  HEARTBEAT = 8;
  HEARTBEAT_RESPONSE = 9;
  
  // Error
  ERROR = 255;
}

// FCP Message wrapper - No protocol headers needed since ZMQ socket already identifies protocol
message Message {
  MessageType type = 1;
  
  oneof payload {
    RegisterConfirmMessage register_confirm = 2;
    DeregisterRequest deregister_request = 3;
    DeregisterResponse deregister_response = 4;
    StatusRequest status_request = 5;
    StatusResponse status_response = 6;
    ConfigureRequest configure_request = 7;
    ConfigureResponse configure_response = 8;
    HeartbeatRequest heartbeat_request = 9;
    HeartbeatResponse heartbeat_response = 10;
    ErrorResponse error = 11;
  }
}

// Registration confirmation (after successful handshake)
message RegisterConfirmMessage {
  string status = 1; // "active" or similar
  string message = 2; // Optional confirmation message
  common.Timestamp timestamp = 3;
}

// Deregistration request
message DeregisterRequest {
  string agent_id = 1;
  common.Timestamp timestamp = 2;
}

// Deregistration response
message DeregisterResponse {
  string status = 1; // "success" or "error"
  string message = 2; // Optional message
  common.Timestamp timestamp = 3;
}

// Status request
message StatusRequest {
  common.Timestamp timestamp = 1;
}

// Status response
message StatusResponse {
  message RuntimeStatus {
    float cpu_usage = 1;
    float memory_usage = 2;
    uint32 uptime_seconds = 3;
  }
  
  string status = 1; // "ok", "degraded", "error"
  RuntimeStatus runtime = 2;
  uint32 agent_count = 3;
  common.Timestamp timestamp = 4;
}

// Configure request
message ConfigureRequest {
  map<string, string> configuration = 1;
  common.Timestamp timestamp = 2;
}

// Configure response
message ConfigureResponse {
  string status = 1; // "success" or "error"
  string message = 2; // Optional message
  common.Timestamp timestamp = 3;
}

// Heartbeat request
message HeartbeatRequest {
  string agent_id = 1;
  common.Timestamp timestamp = 2;
}

// Heartbeat response
message HeartbeatResponse {
  string status = 1; // "ok" or "error"
  common.Timestamp timestamp = 2;
}

// Error response
message ErrorResponse {
  uint32 code = 1;
  string message = 2;
  common.Timestamp timestamp = 3;
} 