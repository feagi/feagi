syntax = "proto3";

package feagi.protocol.fsmp.v1;

import "protocol/common/constants.proto";

// Default sensory channel definitions
enum SensoryChannelType {
  UNKNOWN_SENSORY = 0;
  VISION = 1;
  AUDIO = 2;
  PROPRIOCEPTION = 3;
  TACTILE = 4;
  // Add more as needed
}

// Default motor channel definitions
enum MotorChannelType {
  UNKNOWN_MOTOR = 0;
  MOVEMENT = 101;
  SPEECH = 102;
  MANIPULATION = 103;
  // Add more as needed
}

// FSMP message types
enum MessageType {
  UNKNOWN = 0;
  SENSORY = 1;
  MOTOR = 2;
}

// FSMP (FEAGI Sensorimotor Protocol) message wrapper - No protocol headers since ZMQ socket handles this
message Message {
  MessageType type = 1;
  
  // Use oneof to represent different message types
  oneof payload {
    SensoryData sensory_data = 2;
    MotorData motor_data = 3;
  }
}

// Sensory data message - optimized for high throughput
message SensoryData {
  // Channel ID can be from standard channels or custom channels
  uint32 channel_id = 1;
  
  // Raw binary data (e.g., image bytes, audio samples)
  bytes data = 2;
  
  // Properties provides context for interpreting the data (optional)
  map<string, string> properties = 3;
  
  // Timestamp of when the sensory data was captured
  common.Timestamp timestamp = 4;
}

// Motor data message - optimized for high throughput
message MotorData {
  // Channel ID can be from standard channels or custom channels
  uint32 channel_id = 1;
  
  // Raw binary data representing motor commands
  bytes data = 2;
  
  // Properties provides context for interpreting the data (optional)
  map<string, string> properties = 3;
  
  // Timestamp of when the motor command was generated
  common.Timestamp timestamp = 4;
}

// Stream configuration (used during handshake)
message StreamConfig {
  // Available sensory channels
  repeated uint32 sensory_channels = 1;
  
  // Available motor channels
  repeated uint32 motor_channels = 2;
  
  // Channel properties (e.g. image dimensions, data format)
  message ChannelProperties {
    uint32 channel_id = 1;
    map<string, string> properties = 2; 
  }
  
  repeated ChannelProperties channel_properties = 3;
} 