syntax = "proto3";

package feagi.protocol.handshake.v1;

import "protocol/common/constants.proto";

// Protocol version record used in handshake
message ProtocolVersion {
  // Individual protocol versions the client supports
  uint32 fcp_version = 1;
  uint32 fsmp_version = 2;
  uint32 fvp_version = 3;
}

// Message type for handshake protocol
enum HandshakeMessageType {
  UNKNOWN = 0;
  HELLO = 1;             // Initial client greeting
  WELCOME = 2;           // Server welcome response
  CAPABILITIES = 3;      // Client capabilities
  CONFIGURATION = 4;     // Server configuration response
  READY = 5;             // Client ready signal
  START = 6;             // Server start signal
  ERROR = 7;             // Error condition
}

// Handshake message wrapper
message HandshakeMessage {
  // Protocol identifier and version used during handshake
  common.ProtocolID protocol_id = 1;  // Always set to ProtocolID.FCP for handshake
  uint32 version = 2;                 // Handshake protocol version
  HandshakeMessageType type = 3;
  
  // Payload options
  oneof payload {
    HelloMessage hello = 4;
    WelcomeMessage welcome = 5;
    CapabilitiesMessage capabilities = 6;
    ConfigurationMessage configuration = 7;
    ReadyMessage ready = 8;
    StartMessage start = 9;
    ErrorMessage error = 10;
  }
}

// Initial client greeting
message HelloMessage {
  string agent_id = 1;         // Unique identifier for this agent
  string agent_type = 2;       // Type of agent (for categorization)
  common.Timestamp timestamp = 3;
}

// Server welcome response
message WelcomeMessage {
  string server_id = 1;
  string message = 2;
  common.Timestamp timestamp = 3;
}

// Client capabilities
message CapabilitiesMessage {
  // Protocol versions supported by client
  ProtocolVersion protocol_versions = 1;
  
  // Sensory capabilities
  repeated uint32 supported_sensory_channels = 2;
  
  // Motor capabilities
  repeated uint32 supported_motor_channels = 3;
  
  // Features
  map<string, bool> features = 4;
  
  common.Timestamp timestamp = 5;
}

// Server configuration
message ConfigurationMessage {
  // Protocol versions chosen by server (based on client capabilities)
  ProtocolVersion protocol_versions = 1;
  
  // Negotiated configuration
  map<string, string> config = 2;
  
  common.Timestamp timestamp = 3;
}

// Client is ready
message ReadyMessage {
  common.Timestamp timestamp = 1;
}

// Server says start
message StartMessage {
  // Connection parameters
  map<string, string> connection_params = 1;
  
  common.Timestamp timestamp = 2;
}

// Error condition
message ErrorMessage {
  uint32 error_code = 1;
  string error_message = 2;
  common.Timestamp timestamp = 3;
} 