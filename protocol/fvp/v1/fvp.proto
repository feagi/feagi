syntax = "proto3";

package feagi.protocol.fvp.v1;

import "protocol/common/constants.proto";

// FVP (FEAGI Visualization Protocol) message types
enum MessageType {
  UNKNOWN = 0;
  STRUCTURE = 1;  // Brain structure data
  ACTIVITY = 2;   // Neural activity data
  CONFIG = 3;     // Visualization configuration
}

// FVP message wrapper - No protocol headers since ZMQ socket handles this
message Message {
  MessageType type = 1;
  
  // Use oneof to represent different message types
  oneof payload {
    StructureData structure_data = 2;
    ActivityData activity_data = 3;
    ConfigMessage config = 4;
  }
}

// Brain structure data
message StructureData {
  // Structure information with cortical areas, neural groups, etc.
  
  // Map of cortical area IDs to their definitions
  map<string, CorticalArea> cortical_areas = 1;
  
  // Connections between cortical areas
  repeated Connection connections = 2;
  
  // Timestamp when this structure snapshot was taken
  common.Timestamp timestamp = 3;
}

// Neural activity data - optimized for high throughput
message ActivityData {
  // Map of cortical area IDs to their activity data
  map<string, ActivityGroup> activity = 1;
  
  // Additional information about the activity frame
  uint64 frame_id = 2;
  
  // Timestamp when this activity snapshot was taken
  common.Timestamp timestamp = 3;
  
  // Optionally include a visualization hint
  VisualizationHint hint = 4;
}

// Definition of a cortical area
message CorticalArea {
  string id = 1;
  string name = 2;
  
  // Spatial dimensions
  uint32 x = 3;
  uint32 y = 4;
  uint32 z = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint32 depth = 8;
  
  // Properties
  map<string, string> properties = 9;
}

// A connection between two cortical areas
message Connection {
  string source_id = 1;
  string target_id = 2;
  float strength = 3;
  map<string, string> properties = 4;
}

// Activity data for a cortical area - optimized for efficient transmission
message ActivityGroup {
  string cortical_area_id = 1;
  
  // Raw activity data
  bytes data = 2;
  
  // Encoding information
  string encoding_format = 3;  // e.g., "binary", "float32", etc.
  
  // Optional compression information
  string compression = 4;      // e.g., "none", "zlib", etc.
}

// Visualization configuration message
message ConfigMessage {
  // Visualization settings
  map<string, string> settings = 1;
  
  // Color scheme
  ColorScheme color_scheme = 2;
  
  common.Timestamp timestamp = 3;
}

// Color scheme definition
message ColorScheme {
  string name = 1;
  
  message Color {
    uint32 r = 1;
    uint32 g = 2;
    uint32 b = 3;
    uint32 a = 4; // Alpha transparency
  }
  
  Color background = 2;
  Color inactive = 3;
  Color active_low = 4;
  Color active_medium = 5;
  Color active_high = 6;
  
  // Additional colors by name
  map<string, Color> named_colors = 7;
}

// Visualization hint for special rendering
message VisualizationHint {
  enum HintType {
    NONE = 0;
    HIGHLIGHT = 1;
    FOCUS = 2;
    ALERT = 3;
    CUSTOM = 4;
  }
  
  HintType type = 1;
  repeated string targets = 2;  // Cortical area IDs to apply hint to
  map<string, string> parameters = 3;
} 