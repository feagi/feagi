repos:
  # Ruff linter and formatter - catches undefined names, import issues, etc.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        name: ruff (critical issues)
        args: [--fix, --exit-non-zero-on-fix, --select=F821,F401,F402,E402,E9,F63,F7,F82]
        description: "Catch critical issues: undefined names (F821), import errors, syntax errors"
      - id: ruff-format
        name: ruff (format)
        description: "Format code with ruff"

  # Black code formatter
  # DISABLED: Conflicts with ruff-format. Using ruff-format instead.
  # - repo: https://github.com/psf/black
  #   rev: 25.1.0
  #   hooks:
  #     - id: black
  #       name: black
  #       description: "Format code with black"

  # isort import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort
        args: ["--profile", "black"]
        description: "Sort imports with isort"

  # Custom FEAGI quality checks (pytest-based)
  - repo: local
    hooks:
      - id: check-duplicates
        name: check duplicate functions
        entry: python -m pytest tests/unit/core/test_duplicate_prevention.py::test_basic_duplicate_detection -v --tb=short
        language: system
        files: \.py$
        description: "Detect duplicate function implementations that violate DRY principle"
        pass_filenames: false
        fail_fast: true

      # NPU/BDU compatibility checks (leverages existing pytest infrastructure)
      - id: check-npu-bdu-compatibility
        name: NPU/BDU compatibility check
        entry: python -m pytest tests/npu/test_rtos_rust_compatibility.py::test_npu_rtos_rust_compatibility -v --tb=short
        language: system
        files: ^feagi/(npu|bdu)/.*\.py$
        description: "Ensure NPU/BDU modules maintain Rust/RTOS/SIMD/GPU compatibility"
        pass_filenames: false

      - id: check-simd-compatibility
        name: SIMD compatibility check
        entry: python -m pytest tests/npu/test_simd_compatibility.py::test_comprehensive_simd_assessment -v --tb=short
        language: system
        files: ^feagi/(npu|bdu)/.*\.py$
        description: "Verify SIMD optimization compatibility for NPU/BDU modules"
        pass_filenames: false

      - id: check-wgpu-compatibility
        name: WGPU compatibility check
        entry: python -m pytest tests/npu/test_wgpu_compatibility.py::test_npu_wgpu_compatibility -v --tb=short
        language: system
        files: ^feagi/(npu|bdu)/.*\.py$
        description: "Ensure GPU acceleration compatibility for NPU/BDU modules"
        pass_filenames: false

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        description: "Remove trailing whitespace"
      - id: end-of-file-fixer
        description: "Ensure files end with newline"
      - id: check-yaml
        description: "Check YAML syntax"
      - id: check-toml
        description: "Check TOML syntax"
      - id: check-merge-conflict
        description: "Check for merge conflict markers"
      - id: debug-statements
        description: "Check for debugger imports and breakpoints"

# Global configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
