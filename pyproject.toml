[build-system]
requires = ["setuptools>=42", "wheel", "setuptools-rust>=1.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feagi"
version = "0.1.0"
description = "Framework for Evolutionary Artificial General Intelligence"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Neuraville Inc.", email = "feagi@neuraville.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.21.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "httpx>=0.24.0",
    "PyYAML>=6.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "pyzmq>=26.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.5",
    "psutil>=5.8.0",
    "pyroaring>=1.0.0",
    "feagi-bytes>=0.1.0",
    "packaging>=21.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "memory-profiler>=0.60.0",
    "dataclasses-json>=0.5.7",
]
docs = [
    # Documentation is now handled by Docusaurus (see /website folder)
    # No Python dependencies needed for docs generation
]

[project.urls]
"Homepage" = "https://github.com/neuraville/feagi"
"Bug Tracker" = "https://github.com/neuraville/feagi/issues"
"Documentation" = "https://feagi.neuraville.com"
"Source Code" = "https://github.com/neuraville/feagi"

[tool.setuptools]
packages = ["feagi"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "B", "I"]
ignore = []
