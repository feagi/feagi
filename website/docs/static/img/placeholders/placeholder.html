<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .placeholder {
            width: 800px;
            height: 500px;
            background-color: #e0e0e0;
            border: 2px dashed #999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .placeholder h1 {
            color: #555;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .placeholder p {
            color: #777;
            font-size: 16px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <h1>DIAGRAM PLACEHOLDER</h1>
        <p>This is a placeholder for the diagram. The actual diagram will be added in a future update.</p>
        <p id="diagram-name"></p>
    </div>

    <script>
        // Get the diagram name from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const diagramName = urlParams.get('name') || 'Unnamed Diagram';
        document.getElementById('diagram-name').textContent = diagramName;

        // Set the document title
        document.title = `Placeholder: ${diagramName}`;
    </script>
</body>
</html>
