name: Build and Publish Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
        # macos-13: Intel (x86_64)
        # macos-14: Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel==2.16.2

      - name: Build wheels
        env:
          # Build for Python 3.8, 3.9, 3.10, 3.11, 3.12
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          
          # Skip 32-bit builds and old manylinux
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          
          # Use manylinux2014 for broad compatibility
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          
          # Install Rust in the build environment
          CIBW_BEFORE_ALL_LINUX: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            rustup default stable
            yum install -y openssl-devel || apt-get update && apt-get install -y libssl-dev
          
          CIBW_BEFORE_ALL_MACOS: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            rustup default stable
          
          CIBW_BEFORE_ALL_WINDOWS: |
            rustup default stable
          
          # Set Rust environment for build
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ENVIRONMENT_MACOS: 'PATH="$HOME/.cargo/bin:$PATH"'
          
          # Run tests after building
          # Note: feagi_rust moved to separate feagi-rust-py-libs package
          CIBW_TEST_COMMAND: "python -c \"import feagi; print('✅ Wheel works!')\""
          
          # Repair wheels for better compatibility
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
          
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v3
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  publish:
    name: Publish to TestPyPI (Production PyPI Disabled)
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/feagi/
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist-artifacts

      - name: Consolidate distributions
        run: |
          mkdir -p dist
          cp dist-artifacts/sdist/*.tar.gz dist/
          cp dist-artifacts/wheels-*/*.whl dist/
          ls -lh dist/

      - name: Publish to Test PyPI ONLY
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

      # Production PyPI publishing is DISABLED
      # To enable: change environment to 'pypi' and uncomment below
      # - name: Publish to PyPI
      #   if: github.event_name == 'release'
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     skip-existing: true
      #     verbose: true

  trigger-feagi-bv:
    name: Trigger feagi-bv packaging
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Dispatch feagi-bv workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "publish-feagi-bv.yml",
              ref: context.ref,
              inputs: {
                bv_version: "latest"
              }
            });

  test-install:
    name: Test installation from TestPyPI
    needs: [publish]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for TestPyPI to update
        run: sleep 60

      - name: Install from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ feagi
          python -c "import feagi; print(f'✅ FEAGI {feagi.__version__} installed successfully')"
          # Note: Rust extensions now in separate feagi-rust-py-libs package

      - name: Verify no compilation occurred
        run: |
          echo "✅ Installation from TestPyPI successful without Rust compilation!"

