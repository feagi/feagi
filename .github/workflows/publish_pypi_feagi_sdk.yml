name: Publish to PyPI - FEAGI SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.1.0 or 2.1.0b1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build only, do not publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/feagi-core/
    
    steps:
      - name: Determine version and ref
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"  # Strip 'v' prefix: v2.1.0 → 2.1.0
            REF="${{ github.event.release.tag_name }}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            REF="${GITHUB_REF}"
            # Check if version contains pre-release identifiers
            if [[ "$VERSION" =~ (a|b|rc)[0-9]+ ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          
          # Validate PEP 440 compliance
          echo "Validating version format: $VERSION"
          
          # PEP 440 regex pattern
          # Matches: X.Y.Z, X.Y.ZaN, X.Y.ZbN, X.Y.ZrcN, X.Y.Z.postN, X.Y.Z.devN
          # Does NOT match: X.Y.Z-beta, X.Y.Z_beta, vX.Y.Z, etc.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "ERROR: Version '$VERSION' does not comply with PEP 440"
            echo ""
            echo "Valid PEP 440 formats:"
            echo "  - 2.1.0         (stable release)"
            echo "  - 2.1.0a1       (alpha 1)"
            echo "  - 2.1.0b1       (beta 1)"
            echo "  - 2.1.0rc1      (release candidate 1)"
            echo "  - 2.1.0.post1   (post release)"
            echo "  - 2.1.0.dev1    (development)"
            echo ""
            echo "Invalid formats:"
            echo "  - 2.1.0-beta1   (wrong separator)"
            echo "  - 2.1.0_beta1   (wrong separator)"
            echo "  - v2.1.0        (v prefix not allowed in version)"
            echo "  - 2.1.0beta1    (missing separator)"
            echo ""
            echo "Note: Git tags can use 'v' prefix (e.g., v2.1.0b1)"
            echo "      but the version extracted must be PEP 440 compliant"
            exit 1
          fi
          
          echo "Version format is PEP 440 compliant"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          
          echo ""
          echo "Publishing FEAGI SDK"
          echo "  Version: $VERSION"
          echo "  Pre-release: $IS_PRERELEASE"
          echo "  Ref: $REF"
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.ref }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Verify required CLI modules
        run: |
          echo "Verifying required feagi.cli modules are present..."
          if [ ! -f "feagi/cli/process_utils.py" ]; then
            echo "ERROR: feagi/cli/process_utils.py is missing."
            echo "This module is required (Windows force-kill support). Ensure the ref you are"
            echo "publishing from includes the commit that added process_utils.py."
            echo "Current ref: ${{ steps.version.outputs.ref }}"
            ls -la feagi/cli/ 2>/dev/null || true
            exit 1
          fi
          echo "feagi/cli/process_utils.py OK"
      
      - name: Verify binaries exist
        run: |
          echo "Verifying all required binaries are present..."
          
          MISSING_BINARIES=()
          
          # Check Linux x86_64
          if [ ! -f "feagi/bin/linux-x86_64/feagi" ]; then
            MISSING_BINARIES+=("linux-x86_64/feagi")
          fi
          
          # Check Linux ARM64
          if [ ! -f "feagi/bin/linux-aarch64/feagi" ]; then
            MISSING_BINARIES+=("linux-aarch64/feagi")
          fi
          
          # Check macOS Intel
          if [ ! -f "feagi/bin/darwin-x86_64/feagi" ]; then
            MISSING_BINARIES+=("darwin-x86_64/feagi")
          fi
          
          # Check macOS Apple Silicon
          if [ ! -f "feagi/bin/darwin-aarch64/feagi" ]; then
            MISSING_BINARIES+=("darwin-aarch64/feagi")
          fi
          
          # Check Windows
          if [ ! -f "feagi/bin/windows-x86_64/feagi.exe" ]; then
            MISSING_BINARIES+=("windows-x86_64/feagi.exe")
          fi
          
          if [ ${#MISSING_BINARIES[@]} -gt 0 ]; then
            echo "ERROR: Missing binaries:"
            for bin in "${MISSING_BINARIES[@]}"; do
              echo "  - feagi/bin/${bin}"
            done
            echo ""
            echo "Current bin directory structure:"
            find feagi/bin -type f || echo "  (feagi/bin directory not found)"
            exit 1
          fi
          
          echo "All binaries verified:"
          ls -lh feagi/bin/*/
          
          echo ""
          echo "Binary sizes:"
          du -h feagi/bin/*/*
      
      - name: Update version in files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "Updating version to: $VERSION"
          
          # Update feagi-core pyproject.toml
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          
          # Update feagi meta-package pyproject.toml
          sed -i "s/^version = .*/version = \"$VERSION\"/" feagi-meta/pyproject.toml
          sed -i "s/feagi-core==.*/feagi-core==$VERSION\",/" feagi-meta/pyproject.toml
          
          # Update feagi/__init__.py
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" feagi/__init__.py
          
          # Fetch latest feagi-bv-* from PyPI so feagi requires them.
          # pip install feagi --upgrade will then upgrade BV deps to satisfy.
          BV_WINDOWS=$(curl -sSf https://pypi.org/pypi/feagi-bv-windows/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "2.3.7")
          BV_LINUX=$(curl -sSf https://pypi.org/pypi/feagi-bv-linux/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "2.3.7")
          BV_META=$(curl -sSf https://pypi.org/pypi/feagi-bv/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "2.3.7")
          echo "Latest BV versions: feagi-bv=$BV_META, feagi-bv-windows=$BV_WINDOWS, feagi-bv-linux=$BV_LINUX"
          sed -i "s/feagi-bv-linux>=.*/feagi-bv-linux>=$BV_LINUX,<3.0.0 ; sys_platform == 'linux'\",/" feagi-meta/pyproject.toml
          sed -i "s/feagi-bv-windows>=.*/feagi-bv-windows>=$BV_WINDOWS,<3.0.0 ; sys_platform == 'win32'\",/" feagi-meta/pyproject.toml
          sed -i "s/feagi-bv>=.*/feagi-bv>=$BV_META,<3.0.0 ; sys_platform != 'darwin'\",/" feagi-meta/pyproject.toml
          
          echo ""
          echo "Version updated in:"
          echo "  - pyproject.toml (feagi-core)"
          grep "^version = " pyproject.toml
          echo "  - feagi-meta/pyproject.toml (feagi)"
          grep "^version = " feagi-meta/pyproject.toml
          echo "  - feagi-meta BV deps:"
          grep "feagi-bv" feagi-meta/pyproject.toml
          echo "  - feagi/__init__.py"
          grep "^__version__ = " feagi/__init__.py
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build packages
        run: |
          echo "Building feagi-core (SDK without BV)..."
          python -m build
          echo ""
          echo "feagi-core build complete"
          echo ""
          
          echo "Building feagi (meta-package with BV)..."
          cd feagi-meta
          python -m build
          cd ..
          echo ""
          echo "feagi meta-package build complete"
          echo ""
          
          echo "Built packages:"
          ls -lh dist/
          ls -lh feagi-meta/dist/
          echo ""
          echo "Package sizes:"
          du -h dist/*
          du -h feagi-meta/dist/*
      
      - name: Check package integrity
        run: |
          echo "Checking feagi-core package integrity..."
          python -m twine check dist/*
          
          echo ""
          echo "Verifying all 5 platform binaries are in feagi-core wheel..."
          WHL="$(ls dist/feagi_core*.whl 2>/dev/null | head -1)"
          if [ -z "$WHL" ]; then
            echo "ERROR: No feagi_core wheel found in dist/"
            exit 1
          fi
          REQUIRED=(
            "feagi/bin/linux-x86_64/feagi"
            "feagi/bin/linux-aarch64/feagi"
            "feagi/bin/darwin-x86_64/feagi"
            "feagi/bin/darwin-aarch64/feagi"
            "feagi/bin/windows-x86_64/feagi.exe"
          )
          WHEEL_LIST="$(python -m zipfile -l "$WHL")"
          MISSING=()
          for path in "${REQUIRED[@]}"; do
            if ! echo "$WHEEL_LIST" | grep -qF "$path"; then
              MISSING+=("$path")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: Wheel missing required binaries:"
            for p in "${MISSING[@]}"; do echo "  - $p"; done
            echo ""
            echo "Wheel contents (feagi/bin):"
            echo "$WHEEL_LIST" | grep "feagi/bin" || echo "  (none)"
            exit 1
          fi
          echo "All 5 platform binaries verified in wheel"
          
          echo ""
          echo "Checking feagi meta-package integrity..."
          python -m twine check feagi-meta/dist/*
          
          echo ""
          echo "Package metadata:"
          python -m twine check --strict dist/*
          python -m twine check --strict feagi-meta/dist/*
      
      - name: Publish feagi-core to PyPI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_PASSWORD_TOKEN }}
          packages-dir: dist/
          verbose: true
      
      - name: Publish feagi (meta-package) to PyPI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_PASSWORD_TOKEN }}
          packages-dir: feagi-meta/dist/
          verbose: true
      
      - name: Generate summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_PRERELEASE="${{ steps.version.outputs.is_prerelease }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          if [ "$DRY_RUN" = "true" ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## FEAGI SDK Build (Dry Run)
          
          **Packages Built:**
          - feagi-core (SDK only, ~5MB)
          - feagi (meta-package: SDK + BV, ~5MB)
          
          **Version:** $VERSION  
          **Build Status:** Success  
          
          **Note:** This was a dry run. Packages were NOT published to PyPI.
          EOF
          else
            RELEASE_TYPE="Stable Release"
            if [ "$IS_PRERELEASE" = "true" ]; then
              RELEASE_TYPE="Pre-release"
            fi
            
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## FEAGI SDK Published to PyPI
          
          **Packages Published:**
          - \`feagi-core\` (SDK only, ~5MB)
          - \`feagi\` (meta-package: SDK + BV, ~5MB)
          
          **Version:** $VERSION  
          **Type:** $RELEASE_TYPE  
          **Repository:** pypi.org  
          
          ### Included Binaries
          - Linux x86_64
          - Linux ARM64
          - macOS Intel (x86_64)
          - macOS Apple Silicon (ARM64)
          - Windows x86_64
          
          ### Installation
          EOF
            
            if [ "$IS_PRERELEASE" = "true" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          
          **Pre-release version** - Users must explicitly request:
          
          **Full (with Brain Visualizer):**
          \`\`\`bash
          pip install feagi==$VERSION
          \`\`\`
          
          **Slim (SDK only):**
          \`\`\`bash
          pip install feagi-core==$VERSION
          \`\`\`
          
          Or install latest pre-release:
          \`\`\`bash
          pip install --pre feagi  # or feagi-core
          \`\`\`
          EOF
            else
              cat >> $GITHUB_STEP_SUMMARY << EOF
          
          **Stable version:**
          
          **Full (with Brain Visualizer - Recommended):**
          \`\`\`bash
          pip install feagi
          \`\`\`
          
          **Slim (SDK only - Production/CI):**
          \`\`\`bash
          pip install feagi-core
          \`\`\`
          
          **Specific version:**
          \`\`\`bash
          pip install feagi==$VERSION
          # or
          pip install feagi-core==$VERSION
          \`\`\`
          EOF
            fi
            
            cat >> $GITHUB_STEP_SUMMARY << EOF
          
          ### Test It
          \`\`\`python
          from feagi.engine import FeagiEngine
          
          engine = FeagiEngine()  # Should auto-detect bundled binary
          print(f"FEAGI found at: {engine.feagi_path}")
          \`\`\`
          
          ### View Package
          [https://pypi.org/project/feagi/$VERSION/](https://pypi.org/project/feagi/$VERSION/)
          
          ---
          
          **Note:** Binaries are pre-built and committed to the repository. The workflow packages and publishes them to PyPI.
          EOF
          fi
          
          echo ""
          echo "Workflow complete"
