name: Publish FEAGI SDK to Test PyPI (Staging)

on:
  pull_request:
    branches:
      - staging
    types: [closed]
    paths:
      - 'feagi/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/publish-with-binaries.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  # Package and publish Python SDK with pre-built binaries
  publish:
    name: Package SDK and Publish to Test PyPI
    runs-on: ubuntu-latest
    # Only run if PR was successfully merged to staging OR manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'staging')
    
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/staging
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Verify binaries exist
        run: |
          echo "🔍 Verifying all required binaries are present..."
          
          MISSING_BINARIES=()
          
          # Check Linux x86_64
          if [ ! -f "feagi/bin/linux-x86_64/feagi" ]; then
            MISSING_BINARIES+=("linux-x86_64/feagi")
          fi
          
          # Check Linux ARM64
          if [ ! -f "feagi/bin/linux-aarch64/feagi" ]; then
            MISSING_BINARIES+=("linux-aarch64/feagi")
          fi
          
          # Check macOS Intel
          if [ ! -f "feagi/bin/darwin-x86_64/feagi" ]; then
            MISSING_BINARIES+=("darwin-x86_64/feagi")
          fi
          
          # Check macOS Apple Silicon
          if [ ! -f "feagi/bin/darwin-aarch64/feagi" ]; then
            MISSING_BINARIES+=("darwin-aarch64/feagi")
          fi
          
          # Check Windows
          if [ ! -f "feagi/bin/windows-x86_64/feagi.exe" ]; then
            MISSING_BINARIES+=("windows-x86_64/feagi.exe")
          fi
          
          if [ ${#MISSING_BINARIES[@]} -gt 0 ]; then
            echo "❌ Missing binaries:"
            for bin in "${MISSING_BINARIES[@]}"; do
              echo "  - feagi/bin/${bin}"
            done
            echo ""
            echo "📁 Current bin directory structure:"
            find feagi/bin -type f || echo "  (feagi/bin directory not found)"
            exit 1
          fi
          
          echo "✅ All binaries verified:"
          ls -lh feagi/bin/*/
          
          echo ""
          echo "📊 Binary sizes:"
          du -h feagi/bin/*/*
      
      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep -m 1 'version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building FEAGI SDK version: $VERSION"
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: |
          echo "🔨 Building FEAGI SDK with bundled binaries..."
          python -m build
          echo ""
          echo "✅ Build complete!"
          echo ""
          echo "📦 Package contents:"
          ls -lh dist/
          echo ""
          echo "📊 Package sizes:"
          du -h dist/*
      
      - name: Check package integrity
        run: |
          echo "🔍 Checking package integrity..."
          python -m twine check dist/*
          
          echo ""
          echo "🔍 Verifying binaries are included..."
          python -m zipfile -l dist/*.whl | grep "feagi/bin" || echo "⚠️  No binaries found in wheel!"
      
      - name: Publish to Test PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          echo "📤 Publishing to test.pypi.org..."
          echo "📦 Package files to upload:"
          ls -lh dist/*
          echo ""
          
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "❌ ERROR: TEST_PYPI_API_TOKEN secret is not set!"
            echo "Please add the token in: Settings → Secrets and variables → Actions"
            echo "Get a token from: https://test.pypi.org/manage/account/token/"
            exit 1
          fi
          
          echo "🔐 Authenticating with Test PyPI..."
          python -m twine upload --repository testpypi --verbose dist/* || {
            echo ""
            echo "❌ Upload failed with error code: $?"
            echo ""
            echo "Common issues:"
            echo "  1. Invalid or expired API token - regenerate at https://test.pypi.org/manage/account/token/"
            echo "  2. Token scope - ensure token has 'Entire account' or 'feagi' project scope"
            echo "  3. Version already exists - bump version in pyproject.toml"
            echo "  4. Package name conflict - check https://test.pypi.org/project/feagi/"
            exit 1
          }
          
          echo ""
          echo "✅ Published successfully!"
      
      - name: Generate summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 FEAGI SDK Published with Bundled Binaries
          
          **Package:** feagi  
          **Version:** ${{ steps.get_version.outputs.version }}  
          **Repository:** test.pypi.org  
          
          ### Included Binaries
          - ✅ Linux x86_64
          - ✅ Linux ARM64
          - ✅ macOS Intel (x86_64)
          - ✅ macOS Apple Silicon (ARM64)
          - ✅ Windows x86_64
          
          ### Installation
          \`\`\`bash
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ feagi==${{ steps.get_version.outputs.version }}
          \`\`\`
          
          ### Test It
          \`\`\`python
          from feagi.engine import FeagiEngine
          
          engine = FeagiEngine()  # Should auto-detect bundled binary
          print(f"FEAGI found at: {engine.feagi_path}")
          \`\`\`
          
          ### View Package
          🔗 [https://test.pypi.org/project/feagi/${{ steps.get_version.outputs.version }}/](https://test.pypi.org/project/feagi/${{ steps.get_version.outputs.version }}/)
          
          ---
          
          **Note:** Binaries are pre-built and committed to the repository. The workflow packages and publishes them to TestPyPI.
          EOF
          
          echo ""
          echo "✅ Workflow complete!"



