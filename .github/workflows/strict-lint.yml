name: Strict Code Quality Checks

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  critical-issues:
    name: Critical Issues Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check for undefined names (F821)
        run: |
          echo "::group::Checking for undefined names like 'np' without import..."
          ruff check . --select=F821 --output-format=github
          if [ $? -ne 0 ]; then
            echo "::error::Undefined names found! This includes missing imports like 'np' without 'import numpy as np'"
            exit 1
          fi
          echo "::endgroup::"

      - name: Check for unused imports (F401)
        run: |
          echo "::group::Checking for unused imports..."
          ruff check . --select=F401 --output-format=github
          echo "::endgroup::"

      - name: Check for import errors (F402, E402)
        run: |
          echo "::group::Checking for import issues..."
          ruff check . --select=F402,E402 --output-format=github
          echo "::endgroup::"

      - name: Syntax and basic Python errors
        run: |
          echo "::group::Checking for syntax errors..."
          ruff check . --select=E9,F63,F7,F82 --output-format=github
          echo "::endgroup::"

      - name: Generate lint report
        if: always()
        run: |
          echo "## Lint Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # Check undefined names
          if ruff check . --select=F821 --quiet; then
            echo "| Undefined Names (F821) | Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Undefined Names (F821) | Fail |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check unused imports
          if ruff check . --select=F401 --quiet; then
            echo "| Unused Imports (F401) | Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unused Imports (F401) | Warning |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check import errors
          if ruff check . --select=F402,E402 --quiet; then
            echo "| Import Issues (F402,E402) | Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Import Issues (F402,E402) | Fail |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check syntax errors
          if ruff check . --select=E9,F63,F7,F82 --quiet; then
            echo "| Syntax Errors | Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Syntax Errors | Fail |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tip**: Run \`ruff check . --select=F821\` locally to catch undefined name issues like missing numpy imports!" >> $GITHUB_STEP_SUMMARY

  comprehensive-lint:
    name: Comprehensive Lint
    runs-on: ubuntu-latest
    needs: critical-issues
    continue-on-error: true  # Don't fail the whole pipeline for style issues
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full ruff check (style and quality)
        run: |
          ruff check . --output-format=github

      - name: Black formatting check
        run: |
          black --check --diff .

      - name: Import sorting check
        run: |
          isort --check --diff .
