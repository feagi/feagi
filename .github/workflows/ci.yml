name: FEAGI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'  # Run nightly at midnight UTC

jobs:
  pre-commit-check:
    name: Pre-commit Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files

      - name: Check if pre-commit config exists
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "⚠️  No .pre-commit-config.yaml found. Creating one..."
            cat > .pre-commit-config.yaml << EOF
          repos:
            - repo: https://github.com/astral-sh/ruff-pre-commit
              rev: v0.1.6
              hooks:
                - id: ruff
                  args: [--fix, --exit-non-zero-on-fix]
                - id: ruff-format
            - repo: https://github.com/pre-commit/mirrors-mypy
              rev: v1.7.1
              hooks:
                - id: mypy
                  additional_dependencies: [types-all]
            - repo: https://github.com/psf/black
              rev: 23.9.1
              hooks:
                - id: black
          EOF
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff (strict mode)
        run: |
          ruff check . --select=ALL --ignore=D,ANN,COM,FIX,TD,ERA,PLR0913,PLR0912,PLR2004

      - name: Check for undefined names (critical)
        run: |
          ruff check . --select=F821 --output-format=github

      - name: Check formatting with black
        run: |
          black --check .

      - name: Sort imports with isort
        run: |
          isort --check .

      - name: Type check with mypy (continue on error)
        run: |
          mypy feagi --ignore-missing-imports || true

  detect-changes:
    name: Detect Module Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      changed-files: ${{ steps.changed-files.outputs.all_changed_files }}
      npu-changed: ${{ steps.check-changes.outputs.npu-changed }}
      bdu-changed: ${{ steps.check-changes.outputs.bdu-changed }}
      api-changed: ${{ steps.check-changes.outputs.api-changed }}
      core-changed: ${{ steps.check-changes.outputs.core-changed }}
      utils-changed: ${{ steps.check-changes.outputs.utils-changed }}
      run-all-tests: ${{ steps.check-changes.outputs.run-all-tests }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            feagi/**/*.py

      - name: Analyze changed modules
        id: check-changes
        run: |
          echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"
          
          # Initialize flags
          NPU_CHANGED=false
          BDU_CHANGED=false
          API_CHANGED=false
          CORE_CHANGED=false
          UTILS_CHANGED=false
          RUN_ALL_TESTS=false
          
          # Check if critical files changed (run all tests)
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -E "(main\.py|__init__\.py|setup\.py|pyproject\.toml)"; then
            RUN_ALL_TESTS=true
            echo "Critical files changed - running all tests"
          fi
          
          # Check module-specific changes
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep "feagi/npu/"; then
            NPU_CHANGED=true
            echo "NPU module changes detected"
          fi
          
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep "feagi/bdu/"; then
            BDU_CHANGED=true
            echo "BDU module changes detected"
          fi
          
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep "feagi/api/"; then
            API_CHANGED=true
            echo "API module changes detected"
          fi
          
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep "feagi/core/"; then
            CORE_CHANGED=true
            echo "Core module changes detected"
          fi
          
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep "feagi/utils/"; then
            UTILS_CHANGED=true
            echo "Utils module changes detected"
          fi
          
          # Set outputs
          echo "npu-changed=$NPU_CHANGED" >> $GITHUB_OUTPUT
          echo "bdu-changed=$BDU_CHANGED" >> $GITHUB_OUTPUT
          echo "api-changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "core-changed=$CORE_CHANGED" >> $GITHUB_OUTPUT
          echo "utils-changed=$UTILS_CHANGED" >> $GITHUB_OUTPUT
          echo "run-all-tests=$RUN_ALL_TESTS" >> $GITHUB_OUTPUT

  targeted-tests:
    name: Module-Specific Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, pre-commit-check, lint]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.run-all-tests == 'false'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install ZeroMQ
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run NPU tests
        if: needs.detect-changes.outputs.npu-changed == 'true'
        run: |
          echo "🧠 Running NPU module tests..."
          pytest tests/npu/ tests/unit/npu/ -v --cov=feagi.npu --cov-report=xml:coverage-npu.xml

      - name: Run BDU tests
        if: needs.detect-changes.outputs.bdu-changed == 'true'
        run: |
          echo "🔗 Running BDU module tests..."
          pytest tests/bdu/ tests/unit/bdu/ -v --cov=feagi.bdu --cov-report=xml:coverage-bdu.xml

      - name: Run API tests
        if: needs.detect-changes.outputs.api-changed == 'true'
        run: |
          echo "🌐 Running API module tests..."
          pytest tests/api/ tests/unit/api/ -v --cov=feagi.api --cov-report=xml:coverage-api.xml

      - name: Run Core tests
        if: needs.detect-changes.outputs.core-changed == 'true'
        run: |
          echo "⚙️ Running Core module tests..."
          pytest tests/core/ tests/unit/core/ -v --cov=feagi.core --cov-report=xml:coverage-core.xml

      - name: Run Utils tests
        if: needs.detect-changes.outputs.utils-changed == 'true'
        run: |
          echo "🛠️ Running Utils module tests..."
          pytest tests/utils/ tests/unit/utils/ -v --cov=feagi.utils --cov-report=xml:coverage-utils.xml

      - name: Upload targeted coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage-*.xml
          flags: targeted-tests
          name: codecov-targeted

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [pre-commit-check, lint, detect-changes]
    if: always() && (needs.pre-commit-check.result == 'success' && needs.lint.result == 'success') && (github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.detect-changes.result == 'skipped' || needs.detect-changes.outputs.run-all-tests == 'true')))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install ZeroMQ (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install ZeroMQ (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install zeromq

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          pytest --cov=feagi tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: full-tests
          name: codecov-full

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install ZeroMQ
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmarks
        run: |
          pytest tests/ --benchmark-only

      - name: Store benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: .benchmarks/

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          mkdocs build

      - name: Deploy documentation
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [lint, test, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install ZeroMQ
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true
