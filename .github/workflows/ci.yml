name: FEAGI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'  # Run nightly at midnight UTC

jobs:
  pre-commit-check:
    name: Pre-commit Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files

      - name: Check if pre-commit config exists
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "⚠️  No .pre-commit-config.yaml found. Creating one..."
            cat > .pre-commit-config.yaml << EOF
          repos:
            - repo: https://github.com/astral-sh/ruff-pre-commit
              rev: v0.1.6
              hooks:
                - id: ruff
                  args: [--fix, --exit-non-zero-on-fix]
                - id: ruff-format
            - repo: https://github.com/pre-commit/mirrors-mypy
              rev: v1.7.1
              hooks:
                - id: mypy
                  additional_dependencies: [types-all]
            - repo: https://github.com/psf/black
              rev: 23.9.1
              hooks:
                - id: black
          EOF
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff (strict mode)
        run: |
          ruff check . --select=ALL --ignore=D,ANN,COM,FIX,TD,ERA,PLR0913,PLR0912,PLR2004

      - name: Check for undefined names (critical)
        run: |
          ruff check . --select=F821 --output-format=github

      - name: Check formatting with black
        run: |
          black --check .

      - name: Sort imports with isort
        run: |
          isort --check .

      - name: Type check with mypy (continue on error)
        run: |
          mypy feagi --ignore-missing-imports || true

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [pre-commit-check, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install ZeroMQ (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install ZeroMQ (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install zeromq

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          pytest --cov=feagi tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install ZeroMQ
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmarks
        run: |
          pytest tests/ --benchmark-only

      - name: Store benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: .benchmarks/

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          mkdocs build

      - name: Deploy documentation
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [lint, test, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install ZeroMQ
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true
