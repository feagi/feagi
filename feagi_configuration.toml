# FEAGI Configuration File
# Copyright 2016-2025 Neuraville Inc. All Rights Reserved.
#
# This configuration file uses TOML format for:
# - Rust/RTOS compatibility
# - Cloud-native deployments
# - Human-readable structure with comments

[system]
# System-level configuration
max_cores = 0  # 0 = auto-detect
debug = true
log_level = "INFO"
data_dir = ""  # Must be set via environment variable or configuration override

[genome]
# Genome loading and validation configuration
auto_recovery_on_validation_failure = true  # Allow loading invalid genomes with auto-recovery (default: true)
                                            # Set to false to reject invalid genomes completely for safety/stability
                                            # When true: Invalid genomes are loaded but marked as invalid in state manager
                                            # When false: Invalid genomes cause loading to fail immediately

[api]
# REST API server configuration
# REQUIRED: These values must be provided via environment variables or config override
# Example: FEAGI_API_HOST=0.0.0.0 FEAGI_API_PORT=8000
host = "0.0.0.0"  # Default for cross-platform compatibility, override with FEAGI_API_HOST for production
port = 8000         # Default API port, override with FEAGI_API_PORT for production
workers = 1         # Can be overridden with $FEAGI_API_WORKERS
reload = false      # Can be overridden with $FEAGI_API_RELOAD

[ports]
# ZMQ Communication Ports
#
# ⚠️  CRITICAL: All port values are REQUIRED and must be explicitly set
# ⚠️  DO NOT change these ports while FEAGI is running
# ⚠️  Restart FEAGI after making any port changes
# ⚠️  Ensure all port numbers are unique
#
# Command-line overrides available:
# --zmq-req-port, --zmq-pub-port, --zmq-push-port, etc.

# Core ZMQ Communication Patterns
zmq_req_rep_port = 5555      # Request-Reply pattern
zmq_pub_sub_port = 5556      # Publish-Subscribe pattern
zmq_push_pull_port = 5557    # Push-Pull pattern

# Specialized Data Streams
zmq_sensory_port = 5558      # Sensory data input
zmq_visualization_port = 5562 # Neural activity visualization
zmq_rest_port = 5563         # REST API over ZMQ
zmq_motor_port = 5564        # Motor data output

[zmq]
# ZMQ-specific settings
# REQUIRED: Host must be provided via environment variable or config override
# Example: FEAGI_ZMQ_HOST=0.0.0.0
host = "0.0.0.0"           # Default for cross-platform compatibility, override with FEAGI_ZMQ_HOST for production
enabled = true

# Timeout configurations (all in milliseconds)
polling_timeout = 100        # ZMQ polling timeout
message_buffer_size = 100    # max messages to buffer
socket_connect_timeout = 1000  # Socket connection timeout
socket_receive_timeout = 5000  # Socket receive timeout
socket_send_timeout = 5000     # Socket send timeout
client_heartbeat_timeout = 30000  # Client heartbeat timeout
inactive_client_timeout = 60000   # Consider clients inactive after this

# Stream-specific enable/disable configuration
[zmq.streams]
# Enable/disable individual ZMQ streams

[zmq.streams.visualization]
enabled = true                    # Enable visualization stream
auto_enable_on_subscribers = true # Auto-enable FQ sampler when clients connect
subscriber_check_interval = 1.0  # Seconds between subscriber checks

[zmq.streams.sensory]
enabled = true                    # Enable sensory stream

[zmq.streams.motor]
enabled = true                    # Enable motor stream

[zmq.streams.rest]
enabled = true                    # Enable REST API stream (primary API interface)

[timeouts]
# System-wide timeout configurations (all in seconds unless specified)
graceful_shutdown = 8.0        # Time to wait for graceful shutdown
service_startup = 3.0          # Max time to wait for service startup
thread_join = 2.0              # Default thread join timeout
process_join = 2.0             # Default process join timeout
service_stop = 5.0             # Timeout for stopping services
visualization_shutdown = 5.0    # Visualization-specific shutdown timeout
api_service_shutdown = 10.0    # API service shutdown timeout
fq_sampler_shutdown = 2.0      # FQ sampler shutdown timeout

[agents]
# Agent registration and communication configuration
# Default host for agent IP addresses when not explicitly provided
# Can be overridden with FEAGI_AGENT_DEFAULT_HOST environment variable
default_host = "127.0.0.1"    # Default host for agent IP addresses, override with FEAGI_AGENT_DEFAULT_HOST

[neural]
# Neural processing configuration
burst_engine_timestep = 0.1    # milliseconds
batch_size = 1000              # neurons per batch
use_sparse_computation = true   # optimize for sparse networks
enable_plasticity = true       # learning mechanisms

[connectome]
# Connectome sizing and memory allocation
# These values determine the minimum reserved space for neurons and synapses
# regardless of genome requirements
min_neuron_space = 100000      # Minimum neuron slots to reserve (default safety margin)
min_synapse_space = 500000     # Minimum synapse slots to reserve (default safety margin)
min_memory_neuron_space = 50000 # Minimum memory neuron slots to reserve (separate SoA)

# Dynamic sizing policy:
# - Read genome stats to determine actual neuron/synapse requirements
# - Reserve 50% more than genome requirements OR the minimum values above (whichever is larger)
# - This prevents memory waste while ensuring adequate space for growth
buffer_multiplier = 1.5        # Reserve 50% more than genome requirements (1.5x = +50%)

# Memory system configuration
memory_processing_batch_size = 100    # Process N memory areas per batch operation
memory_pattern_cache_size = 10000     # LRU cache size for pattern lookups
memory_neuron_limit_per_area = 10000  # Maximum memory neurons per memory cortical area

[resources]
# Resource allocation settings
use_gpu = true                 # enable GPU acceleration if available
gpu_memory_fraction = 0.8      # fraction of GPU memory to use
enable_health_check = true     # monitor process health

[logging]
# Logging configuration
global_log_level = "INFO"
print_debug_logs = false
print_burst_info = true
log_file = "feagi.log"
max_log_size = "10MB"
backup_count = 5

[visualization]
# Visualization settings
enabled = true
update_interval = 50  # milliseconds between updates

[compression]
# Data compression settings for ZMQ streams
# LZ4 compression significantly reduces bandwidth usage for visualization and motor data
enabled = true              # Enable/disable LZ4 compression (default: true)
min_size_threshold = 100    # Minimum payload size to attempt compression (bytes)
enable_stats = true         # Collect compression performance statistics
algorithm = "lz4"           # Compression algorithm (currently only LZ4 supported)

# Performance tuning
compress_visualization = true  # Enable compression for visualization streams (high bandwidth)
compress_motor = true         # Enable compression for motor output streams
compress_sensory = false      # Disable compression for sensory input (typically small/real-time)

# Cloud deployment example:
# This file can be mounted as a ConfigMap in Kubernetes:
# kubectl create configmap feagi-config --from-file=feagi_configuration.toml

[memory_processing]
# Memory processing configuration (preferred location)
# Note: Existing [connectome] keys (memory_processing_batch_size, memory_pattern_cache_size)
# are still supported for backward compatibility. This section is authoritative when present.
batch_size = 100            # Process N memory areas per batch operation
pattern_cache_size = 10000  # LRU cache size for pattern lookups

[memory_processing.sleep_manager]
# Background maintenance for memory system during sustained low FCL activity
enabled = true                              # Disabled by default; set true to enable
fcl_low_activity_window_bursts = 50          # Window length (bursts) to average FCL activity
fcl_low_activity_threshold = 5               # Avg neurons per burst considered "low activity"
monitor_interval_seconds = 2.0               # Polling interval for activity check
gc_prune_inactive_after_bursts = 500         # Prune inactive pattern mappings older than this many bursts

[snapshot]
# Brain snapshot configuration (required for /v1/snapshot endpoints)
# Set absolute, writable paths for your environment
output_dir = "output/snapshots"            # default under repository output/
temp_dir = "output/snapshots/tmp"          # default temporary staging
zip_compression = "deflate"  # "deflate" or "store"
# Optional defaults for the new FEAGI Container format (.fc)
# default_format can be "zip" or "fc" (download prefers this format when present)
default_format = "zip"
# fc_compression can be "store" (uncompressed) or "deflate" (zlib)
fc_compression = "store"
