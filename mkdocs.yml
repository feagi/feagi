site_name: FEAGI Connector
site_description: Client-side integration library for agents connecting to FEAGI
site_author: FEAGI Team
site_url: https://feagi.github.io/feagi_connector

repo_name: feagi/feagi_connector
repo_url: https://github.com/feagi/feagi_connector

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          selection:
            docstring_style: google
          rendering:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            show_if_no_docstring: false
            heading_level: 2

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: guide-connector-usage.md
    - ZMQ Communication: guide-zmq-communication.md
  - Technical Documentation:
    - Architecture Overview: arch-connector-overview.md
    - Protocol Specifications: spec-protocols.md
  - API Reference:
    - FeagiClient: api/client.md
    - Protocols: api/protocols.md
    - Command Client: api/command_client.md
    - Sensory Client: api/sensory_client.md
    - Visualization Client: api/viz_client.md
    - Utilities: api/utils.md
  - Examples:
    - Example Agent: examples/example_agent.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/feagi/feagi_connector

copyright: Copyright &copy; 2023 FEAGI Team 